<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 — Dark</title>
<style>
  :root {
    --bg: #0f1115;
    --board: #1a1d24;
    --cell: #22262f;
    --text: #e8eaed;
    --muted: #8b9099;
    --accent: #f2b179;
    --btn: #2a2f3a;
    --btn-hover: #353b47;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }
  .wrap { width: min(92vw, 460px); }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  h1 { font-size: 52px; font-weight: 800; letter-spacing: -2px; }
  .scores { display: flex; gap: 10px; }
  .score-box {
    background: var(--board);
    border-radius: 8px;
    padding: 8px 16px;
    text-align: center;
    min-width: 78px;
  }
  .score-box .label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .score-box .val { font-size: 22px; font-weight: 800; line-height: 1.2; }
  .subbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .subbar p { color: var(--muted); font-size: 14px; }
  button.new {
    background: var(--btn);
    color: var(--text);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
  }
  button.new:hover { background: var(--btn-hover); }
  .board {
    position: relative;
    background: var(--board);
    border-radius: 12px;
    padding: var(--gap);
    width: 100%;
    aspect-ratio: 1 / 1;
    touch-action: none;
  }
  .grid { position: absolute; inset: var(--gap); }
  .grid-row { display: flex; gap: var(--gap); margin-bottom: var(--gap); height: var(--cell-size); }
  .grid-row:last-child { margin-bottom: 0; }
  .grid-cell {
    width: var(--cell-size);
    height: var(--cell-size);
    background: var(--cell);
    border-radius: 8px;
  }
  .tiles { position: absolute; inset: var(--gap); }
  /* Outer tile: owns POSITION only (translate). Never animate scale here. */
  .tile {
    position: absolute;
    width: var(--cell-size);
    height: var(--cell-size);
    transition: transform .13s ease;
    will-change: transform;
  }
  /* Inner tile: owns the LOOK + pop/merge scale. Separate transform = no fighting. */
  .tile-inner {
    width: 100%;
    height: 100%;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 34px;
    will-change: transform;
  }
  .tile.new .tile-inner { animation: pop .16s cubic-bezier(.2,.75,.3,1) both; }
  .tile.merged .tile-inner { animation: bump .16s ease; }
  @keyframes pop {
    0%   { transform: scale(0);   opacity: 0; }
    70%  { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes bump {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .tile.new .tile-inner, .tile.merged .tile-inner { animation: none; }
  }

  /* Tile colors — dark palette */
  .t2    { background: #3a3f4b; color: #e8eaed; }
  .t4    { background: #45495a; color: #e8eaed; }
  .t8    { background: #d98a4e; color: #fff; }
  .t16   { background: #e07b3e; color: #fff; }
  .t32   { background: #e5623a; color: #fff; }
  .t64   { background: #e64a2e; color: #fff; }
  .t128  { background: #d9b23a; color: #fff; font-size: 30px; }
  .t256  { background: #d9a92e; color: #fff; font-size: 30px; }
  .t512  { background: #d99f22; color: #fff; font-size: 30px; }
  .t1024 { background: #6c5ce7; color: #fff; font-size: 24px; }
  .t2048 { background: #8e7bff; color: #fff; font-size: 24px; box-shadow: 0 0 24px rgba(142,123,255,.6); }
  .tbig  { background: #12131a; color: #fff; font-size: 22px; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,17,21,.82);
    border-radius: 12px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    animation: fade .3s ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 42px; font-weight: 800; }
  .overlay.win h2 { color: var(--accent); }
  .overlay-btns { display: flex; gap: 10px; }
  .btn-primary {
    background: var(--accent);
    color: #1a1207;
  }
  .btn-primary:hover { background: #f6c093; }
  /* Keep Going only makes sense after a win */
  #keep { display: none; }
  .overlay.win #keep { display: inline-block; }
  footer { margin-top: 16px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box"><div class="label">Score</div><div class="val" id="score">0</div></div>
        <div class="score-box"><div class="label">Best</div><div class="val" id="best">0</div></div>
      </div>
    </header>
    <div class="subbar">
      <p>Join the tiles, get to <strong>2048</strong>.</p>
      <button class="new" id="new">New Game</button>
    </div>
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay">
        <h2 id="overlay-msg">Game Over</h2>
        <div class="overlay-btns">
          <button class="new btn-primary" id="keep">Keep Going</button>
          <button class="new" id="retry">Try Again</button>
        </div>
      </div>
    </div>
    <footer>Arrow keys / WASD / swipe to move</footer>
  </div>

<script>
(function () {
  const SIZE = 4;
  const board = document.getElementById('board');
  const gridEl = document.getElementById('grid');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');

  let grid, score, best, won, over, idCounter;

  best = parseInt(localStorage.getItem('best2048') || '0', 10);
  bestEl.textContent = best;

  // Build background grid + compute cell sizing via CSS vars
  function layout() {
    const w = board.clientWidth;
    const gap = Math.round(w * 0.028);
    const cell = (w - gap * (SIZE + 1)) / SIZE;
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--cell-size', cell + 'px');
    // reposition existing tiles
    if (grid) render(true);
  }

  function buildGrid() {
    gridEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      const row = document.createElement('div');
      row.className = 'grid-row';
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        row.appendChild(cell);
      }
      gridEl.appendChild(row);
    }
  }

  function cellPos(r, c) {
    const gap = parseFloat(getComputedStyle(board).getPropertyValue('--gap'));
    const cell = parseFloat(getComputedStyle(board).getPropertyValue('--cell-size'));
    return { x: c * (cell + gap), y: r * (cell + gap) };
  }

  function newGame() {
    grid = [];
    for (let r = 0; r < SIZE; r++) grid.push(new Array(SIZE).fill(null));
    score = 0; won = false; over = false; idCounter = 1;
    tilesEl.innerHTML = '';
    overlay.classList.remove('show', 'win');
    addRandom(); addRandom();
    updateScore();
    render();
    saveState();
  }

  function emptyCells() {
    const out = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) out.push({ r, c });
    return out;
  }

  function addRandom() {
    const cells = emptyCells();
    if (!cells.length) return;
    const { r, c } = cells[Math.floor(Math.random() * cells.length)];
    grid[r][c] = { id: idCounter++, value: Math.random() < 0.9 ? 2 : 4, r, c, isNew: true };
  }

  function tileClass(v) {
    if (v > 2048) return 'tbig';
    return 't' + v;
  }

  function render(reposition) {
    const seen = new Set();
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) continue;
        seen.add(t.id);
        let el = document.getElementById('tile-' + t.id);
        const pos = cellPos(r, c);
        if (!el) {
          el = document.createElement('div');
          el.id = 'tile-' + t.id;
          el.className = 'tile';
          const inner = document.createElement('div');
          inner.className = 'tile-inner ' + tileClass(t.value);
          inner.textContent = t.value;
          el.appendChild(inner);
          // Place instantly with NO transition so it never slides in from the corner.
          el.style.transition = 'none';
          el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
          tilesEl.appendChild(el);
          void el.offsetWidth;      // commit the position before re-enabling motion
          el.style.transition = '';
          if (t.isNew && !reposition) {
            el.classList.add('new');
            setTimeout(() => el.classList.remove('new'), 200);
          }
        } else {
          const inner = el.firstChild;
          inner.className = 'tile-inner ' + tileClass(t.value);
          inner.textContent = t.value;
          el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
          if (t.merged && !reposition) {
            el.classList.remove('merged');
            void el.offsetWidth;
            el.classList.add('merged');
          }
        }
        t.isNew = false;
        t.merged = false;
      }
    }
    // remove stale tile elements
    [...tilesEl.children].forEach(el => {
      if (el.classList.contains('dying')) return;
      const id = parseInt(el.id.replace('tile-', ''), 10);
      if (!seen.has(id)) el.remove();
    });
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('best2048', best); } catch (e) {}
    }
  }

  // Persist the in-progress board so closing the tab doesn't lose the game.
  function saveState() {
    try {
      const flat = grid.map(row => row.map(t => t ? { id: t.id, value: t.value } : null));
      localStorage.setItem('game2048', JSON.stringify({ grid: flat, score, won, over, idCounter }));
    } catch (e) {}
  }

  function loadState() {
    let data;
    try { data = JSON.parse(localStorage.getItem('game2048')); } catch (e) { return false; }
    if (!data || !Array.isArray(data.grid) || data.grid.length !== SIZE) return false;
    const next = [];
    let tiles = 0, maxId = 0;
    for (let r = 0; r < SIZE; r++) {
      if (!Array.isArray(data.grid[r]) || data.grid[r].length !== SIZE) return false;
      const row = new Array(SIZE).fill(null);
      for (let c = 0; c < SIZE; c++) {
        const cell = data.grid[r][c];
        if (cell && typeof cell.value === 'number') {
          row[c] = { id: cell.id, value: cell.value, r, c, isNew: false, merged: false };
          tiles++;
          if (cell.id > maxId) maxId = cell.id;
        }
      }
      next.push(row);
    }
    if (!tiles) return false; // nothing to resume — start fresh instead
    grid = next;
    score = data.score || 0;
    won = data.won || false;
    over = data.over || false;
    idCounter = Math.max(data.idCounter || 1, maxId + 1);
    tilesEl.innerHTML = '';
    overlay.classList.remove('show', 'win');
    updateScore();
    render();
    if (over) {
      overlay.classList.add('show');
      overlay.classList.remove('win');
      overlayMsg.textContent = 'Game Over';
      document.getElementById('retry').textContent = 'Try Again';
    }
    return true;
  }

  // Move logic. dir: 0=up,1=right,2=down,3=left
  function move(dir) {
    if (over) return;
    let moved = false;

    // Build traversal order
    const order = [];
    for (let i = 0; i < SIZE; i++) order.push(i);
    const rows = dir === 2 ? [...order].reverse() : order;
    const cols = dir === 1 ? [...order].reverse() : order;

    const vec = [
      { r: -1, c: 0 }, { r: 0, c: 1 }, { r: 1, c: 0 }, { r: 0, c: -1 }
    ][dir];

    const mergedThisMove = new Set();

    for (const r of rows) {
      for (const c of cols) {
        const t = grid[r][c];
        if (!t) continue;
        let nr = r, nc = c;
        // find farthest
        while (true) {
          const tr = nr + vec.r, tc = nc + vec.c;
          if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
          const target = grid[tr][tc];
          if (!target) { nr = tr; nc = tc; continue; }
          // merge?
          if (target.value === t.value && !mergedThisMove.has(target.id) && !mergedThisMove.has(t.id)) {
            // merge into target
            grid[r][c] = null;
            target.value *= 2;
            target.merged = true;
            mergedThisMove.add(target.id);
            score += target.value;
            // the moving tile element slides then gets removed
            const el = document.getElementById('tile-' + t.id);
            if (el) {
              const pos = cellPos(tr, tc);
              el.classList.add('dying');
              el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
              el.style.zIndex = 1;
              setTimeout(() => el.remove(), 120);
            }
            if (target.value === 2048 && !won) won = true;
            moved = true;
          }
          break;
        }
        if (grid[r][c] && (nr !== r || nc !== c)) {
          grid[nr][nc] = t;
          grid[r][c] = null;
          t.r = nr; t.c = nc;
          moved = true;
        }
      }
    }

    if (moved) {
      addRandom();
      updateScore();
      render();
      checkEnd();
      saveState();
    }
  }

  function movesAvailable() {
    if (emptyCells().length) return true;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c].value;
        if (c < SIZE - 1 && grid[r][c + 1].value === v) return true;
        if (r < SIZE - 1 && grid[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function checkEnd() {
    if (won === true) {
      over = false;
      overlay.classList.add('show', 'win');
      overlayMsg.textContent = 'You Win! 🎉';
      document.getElementById('retry').textContent = 'New Game';
      won = 'shown';
      return;
    }
    if (!movesAvailable()) {
      over = true;
      overlay.classList.add('show');
      overlay.classList.remove('win');
      overlayMsg.textContent = 'Game Over';
      document.getElementById('retry').textContent = 'Try Again';
    }
  }

  // Input
  const keyMap = {
    ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3,
    w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3
  };
  window.addEventListener('keydown', e => {
    if (e.key in keyMap) {
      e.preventDefault();
      move(keyMap[e.key]);
    }
  });

  // Touch
  let sx = 0, sy = 0, tracking = false;
  board.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; tracking = true;
  }, { passive: true });
  board.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;
    if (ax > ay) move(dx > 0 ? 1 : 3);
    else move(dy > 0 ? 2 : 0);
  }, { passive: true });

  document.getElementById('new').addEventListener('click', newGame);
  document.getElementById('retry').addEventListener('click', newGame);
  document.getElementById('keep').addEventListener('click', () => {
    overlay.classList.remove('show', 'win');
    saveState();
  });
  window.addEventListener('resize', layout);

  buildGrid();
  layout();
  if (!loadState()) newGame();
})();
</script>
</body>
</html>
